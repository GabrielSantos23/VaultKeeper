name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install
        working-directory: ./vaultkeeper-tauri

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ./vaultkeeper-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "VaultKeeper ${{ github.ref_name }}"
          releaseBody: |
            ## What's New
            
            See [CHANGELOG.md](CHANGELOG.md) for full details.
            
            ## Migration from Python Version
            
            If you're using the Python version of VaultKeeper, you can switch to this version seamlessly:
            
            1. Close the Python app
            2. Install this version
            3. Login with your existing master password
            4. All your data will be there automatically!
            
            ## Auto-Update
            
            This app includes automatic updates. You'll be notified when a new version is available.
            
            ## Downloads
            
            - **Windows**: Download and run `VaultKeeper_*_x64-setup.exe`
            - **macOS (Intel)**: Download and install `VaultKeeper_x64.app.tar.gz`
            - **macOS (Apple Silicon)**: Download and install `VaultKeeper_aarch64.app.tar.gz`
            - **Linux**: Download and run `vaultkeeper_*_amd64.AppImage`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  update-manifest:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download release assets
        uses: robinraju/release-downloader@v1
        with:
          tag: ${{ github.ref_name }}
          fileName: "*"
          out-file-path: "downloads"

      - name: Generate latest.json
        run: |
          cat > latest.json << 'EOF'
          {
            "version": "${{ github.ref_name }}",
            "notes": "See release notes on GitHub",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {}
          }
          EOF
          
          # Extract signatures and build manifest
          # This is a simplified version - you may need to adjust for your needs
          
      - name: Upload latest.json
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.releaseUploadUrl }}
          asset_path: ./latest.json
          asset_name: latest.json
          asset_content_type: application/json
