name: Build Tauri
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: "--bundles nsis"
          - platform: "ubuntu-22.04"
            args: "--bundles appimage"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Python Native Host
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller cryptography argon2-cffi
          pyinstaller --noconfirm --onefile --console --name vk_host app/native/host.py
          python -c "import os, shutil; os.makedirs('vaultkeeper-tauri/src-tauri/bin', exist_ok=True); [shutil.copy(os.path.join('dist', f), 'vaultkeeper-tauri/src-tauri/bin') for f in os.listdir('dist') if f.startswith('vk_host')]"

      - name: Install dependencies
        run: bun install
        working-directory: ./vaultkeeper-tauri

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build Tauri App
        run: bun run tauri build ${{ matrix.args }}
        working-directory: ./vaultkeeper-tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            vaultkeeper-tauri/src-tauri/target/release/bundle/nsis/*.exe
            vaultkeeper-tauri/src-tauri/target/release/bundle/appimage/*.AppImage
          draft: false
          prerelease: false
